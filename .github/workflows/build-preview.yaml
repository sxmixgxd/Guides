name: Build Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Fetch emoji map
        run: curl -sSL https://raw.githubusercontent.com/jackyzha0/quartz/main/quartz/util/emojimap.json -o quartz/util/emojimap.json

      - name: Build Quartz
        run: npx quartz build
